name: Cloudflare app (app/)

# Tests and builds the Cloudflare version of the site on every change to
# app/. Deploying is manual (Actions -> "Cloudflare app" -> Run workflow) and
# needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets;
# see app/DEPLOY.md.

on:
  push:
    paths: ['app/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - run: yarn install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: yarn typecheck

      # unit tests in Node, the API against local D1 / R2 / Queues in workerd
      - run: yarn test

      - run: yarn build

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ inputs.environment == 'production' && '--env production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - run: yarn install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: yarn build
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # new tables first, then the code that uses them
      - run: npx wrangler d1 migrations apply DB --remote $ENV_FLAG

      - run: npx wrangler deploy $ENV_FLAG
