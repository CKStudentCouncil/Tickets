<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="text/javascript">
      // LINE's in-app browser opens the page in the system browser when the URL
      // carries openExternalBrowser=1. Once the param is there, don't redirect
      // again, so an old LINE that ignores it doesn't loop.
      (function(l) {
        var param = 'openExternalBrowser=1';
        var hasParam = /[?&]openExternalBrowser=1(&|$)/.test(l.search);
        if (/\bLine\//.test(navigator.userAgent)) {
          if (!hasParam) {
            l.replace(
              l.pathname + (l.search ? l.search + '&' : '?') + param + l.hash
            );
          }
        } else if (hasParam) {
          var search = l.search
            .slice(1)
            .split('&')
            .filter(function(s) { return s !== param; })
            .join('&');
          window.history.replaceState(
            null,
            null,
            l.pathname + (search ? '?' + search : '') + l.hash
          );
        }
      }(window.location));
    </script>

    <style>
      /* Shown from the first paint until the first page is ready
         (MainLayout.vue removes it), instead of a blank screen */
      html { background: #050608; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 0 16px;
        background: #050608;
        color: rgba(242, 240, 233, 0.62);
        font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 6px;
      }
      #app-splash img { width: min(78vw, 520px); height: auto; }
      #app-splash .splash-line {
        width: min(40vw, 200px);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(242, 240, 233, 0.8), transparent);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #app-splash p { margin: 0; }
      #app-splash .splash-text { letter-spacing: 4px; font-size: 12px; color: rgba(242, 240, 233, 0.45); }
      @keyframes splash-pulse { 50% { opacity: 0.2; transform: scaleX(0.6); } }
      @media (prefers-reduced-motion: reduce) { #app-splash .splash-line { animation: none; } }
    </style>
